repos:
    - repo: https://github.com/pre-commit/mirrors-prettier
      rev: v3.3.3
      hooks:
          - id: prettier
            # Check-only by default (fails instead of silently rewriting files at
            # commit time). Run `npm run format` yourself if it fails, then re-add.
            args: ['--check']
            exclude: ^node_modules/

    - repo: https://github.com/pre-commit/mirrors-eslint
      rev: v9.13.0
      hooks:
          - id: eslint
            files: ^assets/js/.*\.js$
            additional_dependencies:
                - eslint@9.13.0
                - globals@15.11.0

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.6.0
      hooks:
          - id: end-of-file-fixer
          - id: trailing-whitespace
          - id: check-merge-conflict
