<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>OSPF SPF Algorithm Visualizer</title>
<script src="../../assets/js/theme-init.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'};</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/css/theme.css" />
<style>
.mono{font-family:'Fira Code',monospace}

/* canvas */
#topo-wrap{
  position:relative;width:100%;height:100%;
  min-height:480px;
  overflow:hidden;
}
#topo-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#topo-nodes{position:absolute;inset:0;z-index:10}

/* node card */
.n-card{
  position:absolute;transform:translate(-50%,-50%);
  cursor:pointer;user-select:none;
  transition:all .25s ease;
}
.n-inner{
  background:#0f172a;border:2px solid #334155;
  border-radius:12px;padding:7px 12px;min-width:82px;text-align:center;
  transition:all .25s ease;
}
.dark .n-inner{background:#020617}
.n-role{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:999px;
  white-space:nowrap;letter-spacing:.05em;
  background:#1e293b;border:1px solid #334155;color:#94a3b8;
}
.n-icon{font-size:17px;margin-bottom:2px}
.n-label{font-size:11px;font-weight:700;color:#e2e8f0;font-family:'Fira Code',monospace}
.n-rid{font-size:9.5px;color:#64748b;font-family:'Fira Code',monospace}
.n-cost-badge{
  position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);
  font-size:9px;font-weight:700;padding:1px 7px;border-radius:999px;
  white-space:nowrap;font-family:'Fira Code',monospace;
}

/* node state colors */
.ns-normal .n-inner{border-color:#334155}
.ns-source .n-inner{border-color:#3b82f6;box-shadow:0 0 18px rgba(59,130,246,.45)}
.ns-dest   .n-inner{border-color:#f59e0b;box-shadow:0 0 18px rgba(245,158,11,.45)}
.ns-settled .n-inner{border-color:#10b981;box-shadow:0 0 14px rgba(16,185,129,.35)}
.ns-candidate .n-inner{border-color:#a78bfa;box-shadow:0 0 14px rgba(167,139,250,.35)}
.ns-processing .n-inner{border-color:#ec4899;box-shadow:0 0 18px rgba(236,72,153,.5);animation:pulse-node .6s infinite alternate}
.ns-path .n-inner{border-color:#34d399;box-shadow:0 0 16px rgba(52,211,153,.4)}

@keyframes pulse-node{from{box-shadow:0 0 12px rgba(236,72,153,.4)}to{box-shadow:0 0 22px rgba(236,72,153,.7)}}

/* zone */
.zone-box{
  position:absolute;border:2px dashed;border-radius:14px;
  pointer-events:none;z-index:0;
}
.zone-lbl{
  position:absolute;top:7px;left:10px;
  font-size:9px;font-weight:700;letter-spacing:.07em;
  padding:2px 8px;border-radius:4px;opacity:.8;
}

/* link hit area (invisible wide stripe for easier clicking) */
.link-hit{cursor:pointer;stroke:transparent;stroke-width:18;fill:none}
.link-vis{fill:none;stroke-linecap:round;transition:stroke .3s,opacity .3s}
.link-active{stroke:#334155;stroke-width:2.5}
.link-down{stroke:#ef444466;stroke-width:2;stroke-dasharray:6 4;opacity:.5}
.link-path{stroke:#34d399;stroke-width:3;stroke-dasharray:10 4;animation:dash .8s linear infinite}
.link-candidate{stroke:#a78bfa;stroke-width:2;stroke-dasharray:5 3;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}

/* cost label on link */
.cost-lbl{
  position:absolute;transform:translate(-50%,-50%);
  pointer-events:none;z-index:5;
}
.cost-pill{
  font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;
  font-family:'Fira Code',monospace;cursor:pointer;pointer-events:all;
  transition:all .2s;border:1.5px solid;
}
.cost-up{background:#1e293b;border-color:#475569;color:#94a3b8}
.cost-down{background:#1e293b;border-color:#ef444444;color:#ef4444;opacity:.6}
.cost-path{background:#064e3b;border-color:#10b981;color:#34d399}

/* right panel tabs */
.rtab{padding:6px 14px;font-size:11px;font-weight:700;border-radius:8px;cursor:pointer;transition:all .18s;letter-spacing:.03em}
.rtab.active{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;box-shadow:0 2px 10px rgba(99,102,241,.35)}
.rtab:not(.active){color:#64748b}
.rtab:not(.active):hover{color:#94a3b8;background:#1e293b}

/* scenario pills */
.sc-pill{
  padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;
  cursor:pointer;transition:all .2s;border:1.5px solid #334155;color:#64748b;
  white-space:nowrap;
}
.sc-pill.active{border-color:#6366f1;color:#818cf8;background:#6366f110}
.sc-pill:not(.active):hover{border-color:#475569;color:#94a3b8}

/* SPF step row */
.spf-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-size:11.5px;transition:background .2s}
.spf-row.current{background:#6366f115;border:1px solid #6366f130}
.spf-row.done{opacity:.5}

/* routing table */
.rt-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding:5px 8px;border-radius:6px;font-size:11px;align-items:center}
.rt-row.changed{background:#06404020;border:1px solid #06404050}
.rt-row.removed{opacity:.4;text-decoration:line-through}

/* lsdb row */
.lsdb-row{display:grid;grid-template-columns:60px 1fr 1fr 60px;gap:6px;padding:4px 8px;font-size:10.5px;align-items:center;border-radius:6px}
.lsdb-row:hover{background:#1e293b}

/* control bar */
#ctrl-bar{background:rgba(15,23,42,.95);border-top:1px solid #1e293b;backdrop-filter:blur(10px)}

/* bandwidth selector popup */
.bw-popup{
  position:fixed;z-index:200;background:#0f172a;border:1px solid #334155;
  border-radius:12px;padding:10px;min-width:180px;box-shadow:0 8px 32px rgba(0,0,0,.5);
}
.bw-opt{padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'Fira Code',monospace;transition:background .15s;white-space:nowrap}
.bw-opt:hover{background:#1e293b}

/* teaching note */
#teaching-note{border-left:3px solid #6366f1;background:#6366f108}

/* spf auto animate */
.spf-animate-in{animation:slideIn .25s ease both}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* link path arrow marker */
</style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-200">

         style="background:linear-gradient(135deg,#3b82f6,#6366f1)" title="Về trang chủ Portfolio">

      <i class="fas fa-arrow-right text-slate-600 text-[10px] mx-1"></i>

      <i class="fas fa-plug-circle-xmark mr-2"></i><span id="bw-toggle-lbl">Shutdown Link</span>

<script>
// ═══════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════

const BW_TYPES = [
  { label:'GigabitEthernet (1 Gbps)', bw:1000,  cost:1,   icon:'fa-bolt',          color:'#34d399' },
  { label:'FastEthernet (100 Mbps)',  bw:100,   cost:1,   icon:'fa-circle-dot',    color:'#60a5fa' },
  { label:'Ethernet (10 Mbps)',       bw:10,    cost:10,  icon:'fa-ethernet',      color:'#a78bfa' },
  { label:'T1 Serial (1.544 Mbps)',   bw:1.544, cost:64,  icon:'fa-wave-square',   color:'#fb923c' },
  { label:'56k Serial (56 kbps)',     bw:0.056, cost:1785,icon:'fa-signal',        color:'#f87171' },
];

// Base topology — OSPF multi-area: Area 0 + Area 1 + Area 2
// REF canvas: 900×500
const BASE_GRAPH = {
  nodes: [
    { id:'R1', label:'R1', rid:'10.0.0.1', area:'0', role:'Backbone',   x:160, y:170, icon:'fa-circle-nodes' },
    { id:'R2', label:'R2', rid:'10.0.0.2', area:'0', role:'Backbone',   x:390, y:100, icon:'fa-circle-nodes' },
    { id:'R3', label:'R3', rid:'10.0.0.3', area:'0', role:'Backbone',   x:390, y:260, icon:'fa-circle-nodes' },
    { id:'R4', label:'R4', rid:'10.0.0.4', area:'0', role:'Backbone',   x:620, y:170, icon:'fa-circle-nodes' },
    { id:'ABR1',label:'ABR1',rid:'10.0.0.5',area:'ABR',role:'ABR A0↔A1',x:770, y:100, icon:'fa-layer-group' },
    { id:'ABR2',label:'ABR2',rid:'10.0.0.6',area:'ABR',role:'ABR A0↔A2',x:770, y:260, icon:'fa-layer-group' },
    { id:'R5', label:'R5', rid:'10.0.0.7', area:'1', role:'Area 1',     x:900, y:100, icon:'fa-circle-nodes' },
    { id:'R6', label:'R6', rid:'10.0.0.8', area:'2', role:'Area 2',     x:900, y:260, icon:'fa-circle-nodes' },
  ],
  links: [
    { id:'L1',  from:'R1',  to:'R2',  bwType:0, state:'up' },
    { id:'L2',  from:'R1',  to:'R3',  bwType:2, state:'up' }, // Ethernet cost 10
    { id:'L3',  from:'R2',  to:'R3',  bwType:0, state:'up' },
    { id:'L4',  from:'R2',  to:'R4',  bwType:0, state:'up' },
    { id:'L5',  from:'R3',  to:'R4',  bwType:0, state:'up' },
    { id:'L6',  from:'R4',  to:'ABR1',bwType:0, state:'up' },
    { id:'L7',  from:'R4',  to:'ABR2',bwType:0, state:'up' },
    { id:'L8',  from:'ABR1',to:'R5',  bwType:0, state:'up' },
    { id:'L9',  from:'ABR2',to:'R6',  bwType:0, state:'up' },
  ],
  areas: [
    { id:'0', label:'Area 0 — Backbone', x1:60,  y1:40,  x2:700, y2:320, color:'#3b82f6' },
    { id:'1', label:'Area 1',            x1:720, y1:40,  x2:960, y2:175, color:'#6366f1' },
    { id:'2', label:'Area 2',            x1:720, y1:190, x2:960, y2:325, color:'#0ea5e9' },
  ]
};

const SCENARIOS = [
  {
    id:'baseline', label:'Baseline', icon:'fa-check-circle',
    desc:'Tất cả link UP, GigabitEthernet. Xem SPF tính shortest path từ R1 đến R5.',
    patches:[], src:'R1', dst:'R5',
    note:'<b>Baseline:</b> SPF chạy với cost đồng đều. Path ngắn nhất R1→R2→R4→ABR1→R5 (cost 4). Lưu ý R1→R3→R4 dài hơn do link R1-R3 là Ethernet (cost 10).'
  },
  {
    id:'link-fail', label:'Link Failure', icon:'fa-plug-circle-xmark',
    desc:'Shutdown link R2-R4. Traffic buộc phải đi qua R3.',
    patches:[{id:'L4',state:'down'}], src:'R1', dst:'R5',
    note:'<b>Link Failure — R2↔R4 DOWN:</b> SPF loại link này khỏi graph. Best path mới: R1→R2→R3→R4→ABR1→R5 (cost 13) hoặc R1→R3→R4→ABR1→R5 (cost 12). Quan sát routing table thay đổi next-hop.'
  },
  {
    id:'cost-tune', label:'Cost Tuning', icon:'fa-sliders',
    desc:'Đổi R1-R2 thành T1 Serial (cost 64). SPF chuyển traffic sang đường qua R3.',
    patches:[{id:'L1',bwType:3}], src:'R1', dst:'R5',
    note:'<b>Cost Tuning — R1↔R2 thành T1 Serial:</b> Cost 64 đẩy path qua R1→R2 lên rất cao. Best path: R1→R3→R4→ABR1→R5 (cost 12). Đây là kỹ thuật traffic engineering cơ bản trong OSPF.'
  },
  {
    id:'dual-fail', label:'Dual Failure', icon:'fa-triangle-exclamation',
    desc:'Shutdown cả L4 (R2-R4) và L5 (R3-R4). R4, ABR1, ABR2, R5, R6 unreachable.',
    patches:[{id:'L4',state:'down'},{id:'L5',state:'down'}], src:'R1', dst:'R5',
    note:'<b>Dual Failure — R2↔R4 và R3↔R4 DOWN:</b> R4 bị cô lập khỏi backbone. Tất cả prefix phía sau R4 (Area 1, Area 2) biến khỏi routing table R1, R2, R3. OSPF flooding Type 1 LSA mới với seq# cao hơn.'
  },
  {
    id:'ecmp', label:'ECMP', icon:'fa-code-branch',
    desc:'Đặt tất cả link cùng cost (GigabitEthernet). R1→R4 có 2 path bằng nhau.',
    patches:[{id:'L2',bwType:0}], src:'R1', dst:'R4',
    note:'<b>ECMP — Equal Cost Multi-Path:</b> Hai path R1→R2→R4 và R1→R3→R4 có cost = 2. OSPF cài cả hai vào routing table. Cisco IOS mặc định load-balance tối đa 4 equal-cost paths (max-paths 4).'
  },
];

// ═══════════════════════════════════════════════════════
// DIJKSTRA ENGINE
// ═══════════════════════════════════════════════════════
function dijkstra(nodes, links, srcId) {
  // Build adjacency from active links only
  const adj = {};
  nodes.forEach(n => adj[n.id] = []);
  links.forEach(l => {
    if (l.state === 'down') return;
    const cost = BW_TYPES[l.bwType].cost;
    adj[l.from].push({ to: l.to, cost, linkId: l.id });
    adj[l.to].push({ to: l.from, cost, linkId: l.id });
  });

  const dist = {}, prev = {}, prevLink = {}, settled = new Set(), steps = [];
  nodes.forEach(n => { dist[n.id] = Infinity; prev[n.id] = null; prevLink[n.id] = null; });
  dist[srcId] = 0;

  // Priority queue (simple array for small graphs)
  let candidates = [{ id: srcId, cost: 0 }];

  steps.push({
    action: 'INIT',
    processing: null,
    settled: [],
    candidates: [{ id: srcId, cost: 0 }],
    dist: { ...dist },
    desc: `Khởi tạo SPF tree. Đặt ${srcId} vào Candidate list với cost = 0. Tất cả router khác = ∞.`
  });

  while (candidates.length > 0) {
    // Pick minimum cost
    candidates.sort((a, b) => a.cost - b.cost);
    const cur = candidates.shift();
    if (settled.has(cur.id)) continue;
    settled.add(cur.id);

    const neighbors = adj[cur.id];
    const expandDesc = [];

    neighbors.forEach(nb => {
      if (settled.has(nb.to)) return;
      const newCost = dist[cur.id] + nb.cost;
      if (newCost < dist[nb.to]) {
        dist[nb.to] = newCost;
        prev[nb.to] = cur.id;
        prevLink[nb.to] = nb.linkId;
        // update or add to candidates
        const existing = candidates.find(c => c.id === nb.to);
        if (existing) existing.cost = newCost;
        else candidates.push({ id: nb.to, cost: newCost });
        expandDesc.push(`${nb.to}: cost ${cur.cost} + ${nb.cost} = <b>${newCost}</b>`);
      } else {
        expandDesc.push(`${nb.to}: cost ${newCost} ≥ ${dist[nb.to]} → bỏ qua`);
      }
    });

    const sortedCands = [...candidates].sort((a,b)=>a.cost-b.cost);
    steps.push({
      action: 'SETTLE',
      processing: cur.id,
      settled: [...settled],
      candidates: sortedCands.map(c => ({ id: c.id, cost: dist[c.id] })),
      dist: { ...dist },
      prev: { ...prev },
      prevLink: { ...prevLink },
      desc: `Settle <b>${cur.id}</b> (cost=${cur.cost}). Expand neighbors: ${expandDesc.join(' · ') || 'không có neighbor mới'}.`
    });

    if (candidates.length === 0) break;
  }

  steps.push({
    action: 'DONE',
    processing: null,
    settled: [...settled],
    candidates: [],
    dist: { ...dist },
    prev: { ...prev },
    prevLink: { ...prevLink },
    desc: `SPF hoàn thành. ${nodes.filter(n=>dist[n.id]<Infinity).length} router reachable từ ${srcId}.`
  });

  return { dist, prev, prevLink, steps };
}

function getPath(prev, srcId, dstId) {
  const path = [];
  let cur = dstId;
  while (cur && cur !== srcId) {
    path.unshift(cur);
    cur = prev[cur];
  }
  if (cur === srcId) path.unshift(srcId);
  return path.length > 1 ? path : [];
}

// ═══════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════
const App = (() => {
  // mutable graph state (deep clone from base)
  let graph = null;
  let src = 'R1', dst = 'R5';
  let spfResult = null;
  let spfStepIdx = 0;
  let playing = false;
  let playTimer = null;
  let activeTab = 'spf';
  let activeScenario = 'baseline';
  let selectedLink = null; // for popup

  const REF_W = 960, REF_H = 360;

  // ── init ────────────────────────────────────────────
  function init() {
    loadScenario('baseline');
    buildSelectors();
    buildScenarioBar();
    document.addEventListener('click', () => closePopup());
  }

  function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

  function loadScenario(id) {
    activeScenario = id;
    const sc = SCENARIOS.find(s => s.id === id);
    graph = deepClone(BASE_GRAPH);
    // apply patches
    sc.patches.forEach(p => {
      const link = graph.links.find(l => l.id === p.id);
      if (!link) return;
      if (p.state !== undefined) link.state = p.state;
      if (p.bwType !== undefined) link.bwType = p.bwType;
    });
    src = sc.src;
    dst = sc.dst;
    updateSelectors();
    buildScenarioBar();
    runSPF();
    renderTopology();
    showTeachingNote(sc.note);
  }

  function resetTopology() {
    loadScenario(activeScenario);
  }

  // ── selectors ───────────────────────────────────────
  function buildSelectors() {
    ['sel-src','sel-src-m','sel-dst','sel-dst-m'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      BASE_GRAPH.nodes.forEach(n => {
        const o = document.createElement('option');
        o.value = n.id; o.textContent = n.id; el.appendChild(o);
      });
      el.onchange = () => {
        if (id.includes('src')) src = el.value;
        else dst = el.value;
        // sync pairs
        document.getElementById('sel-src').value = src;
        const sm = document.getElementById('sel-src-m'); if(sm) sm.value = src;
        document.getElementById('sel-dst').value = dst;
        const dm = document.getElementById('sel-dst-m'); if(dm) dm.value = dst;
        runSPF(); renderTopology();
      };
    });
    updateSelectors();
  }

  function updateSelectors() {
    ['sel-src','sel-src-m'].forEach(id => { const el=document.getElementById(id); if(el) el.value=src; });
    ['sel-dst','sel-dst-m'].forEach(id => { const el=document.getElementById(id); if(el) el.value=dst; });
  }

  // ── scenario bar ────────────────────────────────────
  function buildScenarioBar() {
    const bar = document.getElementById('scenario-bar');
    bar.innerHTML = '';
    SCENARIOS.forEach(sc => {
      const btn = document.createElement('button');
      btn.className = `sc-pill ${sc.id===activeScenario?'active':''}`;
      btn.innerHTML = `<i class="fas ${sc.icon} mr-1 text-[10px]"></i>${sc.label}`;
      btn.title = sc.desc;
      btn.onclick = () => loadScenario(sc.id);
      bar.appendChild(btn);
    });
  }

  // ── SPF ─────────────────────────────────────────────
  function runSPF() {
    spfResult = dijkstra(graph.nodes, graph.links, src);
    spfStepIdx = 0;
    updateStepIndicator();
    renderPanel();
  }

  function spfNext() {
    if (!spfResult) return;
    if (spfStepIdx < spfResult.steps.length - 1) {
      spfStepIdx++;
      renderTopology();
      renderPanel();
      updateStepIndicator();
    }
  }

  function spfPrev() {
    if (!spfResult) return;
    if (spfStepIdx > 0) {
      spfStepIdx--;
      renderTopology();
      renderPanel();
      updateStepIndicator();
    }
  }

  function spfPlayPause() {
    if (playing) {
      playing = false;
      clearInterval(playTimer);
      document.getElementById('play-icon').className = 'fas fa-play';
      document.getElementById('play-lbl').textContent = 'Chạy SPF';
    } else {
      playing = true;
      document.getElementById('play-icon').className = 'fas fa-pause';
      document.getElementById('play-lbl').textContent = 'Dừng';
      const speed = parseInt(document.getElementById('speed-slider').value);
      playTimer = setInterval(() => {
        if (spfStepIdx >= spfResult.steps.length - 1) {
          spfPlayPause();
        } else {
          spfNext();
        }
      }, 2000 - speed + 200);
    }
  }

  function spfReset() {
    if (playing) spfPlayPause();
    spfStepIdx = 0;
    renderTopology();
    renderPanel();
    updateStepIndicator();
  }

  function updateStepIndicator() {
    if (!spfResult) return;
    document.getElementById('step-cur').textContent = spfStepIdx;
    document.getElementById('step-tot').textContent = spfResult.steps.length - 1;
  }

  // ── TOPOLOGY ────────────────────────────────────────
  function getNodePx(nodeId) {
    const n = graph.nodes.find(x => x.id === nodeId);
    if (!n) return { x:0, y:0 };
    const wrap = document.getElementById('topo-wrap');
    const W = wrap.clientWidth || REF_W;
    const H = wrap.clientHeight || REF_H;
    return { x: n.x / REF_W * W, y: n.y / REF_H * H };
  }

  function renderTopology() {
    const step = spfResult ? spfResult.steps[spfStepIdx] : null;
    const finalStep = spfResult ? spfResult.steps[spfResult.steps.length-1] : null;
    const path = finalStep && finalStep.prev ? getPath(finalStep.prev, src, dst) : [];
    const pathLinks = new Set();
    for (let i=0; i<path.length-1; i++) {
      const a=path[i], b=path[i+1];
      const lnk = graph.links.find(l => (l.from===a&&l.to===b)||(l.from===b&&l.to===a));
      if (lnk) pathLinks.add(lnk.id);
    }

    renderZones();
    renderLinks(step, pathLinks, path);
    renderNodes(step, path);
    setTimeout(() => { clampNodes(); redrawLinks(step, pathLinks, path); }, 55);
  }

  function renderZones() {
    const wrap = document.getElementById('topo-wrap');
    wrap.querySelectorAll('.zone-box').forEach(e=>e.remove());
    const W = wrap.clientWidth || REF_W;
    const H = wrap.clientHeight || REF_H;
    graph.areas.forEach(a => {
      const box = document.createElement('div');
      box.className = 'zone-box';
      box.style.cssText = `
        left:${a.x1/REF_W*100}%;top:${a.y1/REF_H*100}%;
        width:${(a.x2-a.x1)/REF_W*100}%;height:${(a.y2-a.y1)/REF_H*100}%;
        border-color:${a.color}55;background:${a.color}08;
      `;
      const lbl = document.createElement('div');
      lbl.className='zone-lbl';
      lbl.style.cssText=`color:${a.color};background:${a.color}18;font-size:9px;`;
      lbl.textContent = a.label;
      box.appendChild(lbl);
      wrap.appendChild(box);
    });
  }

  function renderLinks(step, pathLinks, path) {
    const svgHit = document.getElementById('svg-links-hit');
    const svgVis = document.getElementById('svg-links-vis');
    const svgCost = document.getElementById('svg-cost-labels');
    svgHit.innerHTML=''; svgVis.innerHTML=''; svgCost.innerHTML='';

    graph.links.forEach(link => {
      const a = getNodePx(link.from);
      const b = getNodePx(link.to);
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      const bwt = BW_TYPES[link.bwType];
      const isPath = pathLinks.has(link.id);
      const isDown = link.state==='down';

      // hit area
      const hit = document.createElementNS('http://www.w3.org/2000/svg','line');
      hit.setAttribute('x1',a.x);hit.setAttribute('y1',a.y);
      hit.setAttribute('x2',b.x);hit.setAttribute('y2',b.y);
      hit.className.baseVal='link-hit';
      hit.dataset.linkId = link.id;
      hit.addEventListener('click', e => { e.stopPropagation(); showLinkPopup(link.id, e); });
      svgHit.appendChild(hit);

      // visual line
      const vis = document.createElementNS('http://www.w3.org/2000/svg','line');
      vis.setAttribute('x1',a.x);vis.setAttribute('y1',a.y);
      vis.setAttribute('x2',b.x);vis.setAttribute('y2',b.y);
      vis.className.baseVal = `link-vis ${isDown?'link-down':isPath?'link-path':'link-active'}`;
      if (isPath) vis.setAttribute('marker-end','url(#arr-path)');
      svgVis.appendChild(vis);

      // cost label (foreignObject for HTML pill)
      const fo = document.createElementNS('http://www.w3.org/2000/svg','foreignObject');
      fo.setAttribute('x',mx-25);fo.setAttribute('y',my-11);
      fo.setAttribute('width',50);fo.setAttribute('height',22);
      fo.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml">
        <div class="cost-pill ${isDown?'cost-down':isPath?'cost-path':'cost-up'}"
             onclick="event.stopPropagation();App.showLinkPopupById('${link.id}',event)"
             title="Click để đổi cáp / shutdown">
          ${isDown?'DOWN':bwt.cost}
        </div>
      </div>`;
      svgCost.appendChild(fo);
    });
  }

  function renderNodes(step, path) {
    const container = document.getElementById('topo-nodes');
    container.querySelectorAll('.n-card').forEach(e=>e.remove());
    const finalStep = spfResult ? spfResult.steps[spfResult.steps.length-1] : null;

    graph.nodes.forEach(n => {
      let state = 'normal';
      if (n.id === src) state = 'source';
      else if (n.id === dst) state = 'dest';
      if (step) {
        if (step.settled && step.settled.includes(n.id) && n.id!==src && n.id!==dst) state='settled';
        if (step.candidates && step.candidates.find(c=>c.id===n.id) && n.id!==src && n.id!==dst) state='candidate';
        if (step.processing === n.id) state='processing';
      }
      if (path.includes(n.id) && n.id!==src && n.id!==dst) state='path';

      const cost = finalStep && finalStep.dist ? finalStep.dist[n.id] : null;
      const costTxt = cost===null?'?':cost===Infinity?'∞':cost;

      const el = document.createElement('div');
      el.className = `n-card ns-${state}`;
      el.id = 'node-'+n.id;
      const W = document.getElementById('topo-wrap').clientWidth || REF_W;
      const H = document.getElementById('topo-wrap').clientHeight || REF_H;
      el.style.left = (n.x/REF_W*100)+'%';
      el.style.top  = (n.y/REF_H*100)+'%';

      const stateColor = {
        normal:'#475569',source:'#3b82f6',dest:'#f59e0b',
        settled:'#10b981',candidate:'#a78bfa',processing:'#ec4899',path:'#34d399'
      }[state]||'#475569';

      const stepCost = step && step.dist ? step.dist[n.id] : null;
      const stepCostTxt = stepCost===null?'':stepCost===Infinity?'∞':stepCost;

      el.innerHTML = `
        <div class="n-inner">
          <div class="n-role">${n.role}</div>
          <div class="n-icon"><i class="fas ${n.icon}" style="color:${stateColor}"></i></div>
          <div class="n-label">${n.label}</div>
          <div class="n-rid">${n.rid}</div>
          ${step && step.action!=='INIT' ? `<div class="n-cost-badge" style="background:${stateColor}20;border:1px solid ${stateColor}50;color:${stateColor}">${stepCostTxt}</div>` : ''}
        </div>`;
      container.appendChild(el);
    });
  }

  function clampNodes() {
    const canvas = document.getElementById('topo-wrap');
    if (!canvas) return;
    const cr = canvas.getBoundingClientRect();
    if (!cr.width) return;
    const BADGE=22, EDGE=6;
    canvas.querySelectorAll('[id^="node-"]').forEach(node => {
      const nr = node.getBoundingClientRect();
      const hPx=cr.height/100, wPx=cr.width/100;
      let top=parseFloat(node.style.top)||50;
      let left=parseFloat(node.style.left)||50;
      const tc=(cr.top+BADGE)-nr.top; if(tc>0) top+=tc/hPx;
      const bc=nr.bottom-(cr.bottom-EDGE); if(bc>0) top-=bc/hPx;
      const lc=(cr.left+EDGE)-nr.left; if(lc>0) left+=lc/wPx;
      const rc=nr.right-(cr.right-EDGE); if(rc>0) left-=rc/wPx;
      node.style.top=top+'%';
      node.style.left=left+'%';
    });
  }

  function redrawLinks(step, pathLinks, path) {
    const svgHit = document.getElementById('svg-links-hit');
    const svgVis = document.getElementById('svg-links-vis');
    const svgCost = document.getElementById('svg-cost-labels');
    svgHit.innerHTML=''; svgVis.innerHTML=''; svgCost.innerHTML='';
    renderLinks(step, pathLinks, path);
  }

  // ── PANEL ────────────────────────────────────────────
  function setTab(tab) {
    activeTab = tab;
    ['spf','lsdb','rt'].forEach(t => {
      const btn = document.getElementById('tab-'+t);
      btn.className = `rtab${t===tab?' active':''}`;
    });
    renderPanel();
  }

  function renderPanel() {
    const body = document.getElementById('panel-body');
    if (activeTab==='spf') renderSPFPanel(body);
    else if (activeTab==='lsdb') renderLSDBPanel(body);
    else renderRTPanel(body);
  }

  function renderSPFPanel(body) {
    if (!spfResult) { body.innerHTML=''; return; }
    const step = spfResult.steps[spfStepIdx];
    let html = '';

    // current step highlight
    html += `<div class="rounded-xl bg-indigo-500/10 border border-indigo-500/25 p-3 spf-animate-in">
      <div class="flex items-center gap-2 mb-1.5">
        <span class="text-[9px] mono uppercase tracking-widest text-indigo-400">${step.action}</span>
        ${step.processing?`<span class="text-xs font-bold text-pink-400 mono">${step.processing}</span>`:''}
      </div>
      <div class="text-xs text-slate-400 leading-relaxed" style="font-size:11.5px">${step.desc}</div>
    </div>`;

    // candidate list
    if (step.candidates && step.candidates.length>0) {
      html += `<div class="rounded-xl bg-slate-800/60 border border-slate-700 p-3">
        <div class="text-[9px] uppercase tracking-widest text-violet-400 mb-2 mono">Candidate List</div>
        <div class="flex flex-wrap gap-1.5">
          ${step.candidates.map(c=>`
            <span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg text-xs mono font-bold" style="background:#7c3aed18;border:1px solid #7c3aed40;color:#a78bfa">
              ${c.id} <span class="opacity-60">cost</span> ${c.cost===Infinity?'∞':c.cost}
            </span>`).join('')}
        </div>
      </div>`;
    }

    // settled set
    if (step.settled && step.settled.length>0) {
      html += `<div class="rounded-xl bg-slate-800/60 border border-slate-700 p-3">
        <div class="text-[9px] uppercase tracking-widest text-emerald-400 mb-2 mono">Settled (SPF Tree)</div>
        <div class="flex flex-wrap gap-1.5">
          ${step.settled.map(s=>`
            <span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg text-xs mono font-bold" style="background:#05966918;border:1px solid #05966940;color:#34d399">
              ${s} <span class="opacity-60">${step.dist&&step.dist[s]!==undefined?step.dist[s]:''}</span>
            </span>`).join('')}
        </div>
      </div>`;
    }

    // distance table
    if (step.dist) {
      const finalStep = spfResult.steps[spfResult.steps.length-1];
      html += `<div class="rounded-xl bg-slate-800/60 border border-slate-700 overflow-hidden">
        <div class="text-[9px] uppercase tracking-widest text-slate-400 px-3 py-2 mono border-b border-slate-700">Distance Vector (tại bước này)</div>
        <div class="divide-y divide-slate-700/50">
          ${graph.nodes.map(n=>{
            const d=step.dist[n.id];
            const prev=step.prev&&step.prev[n.id];
            const settled=step.settled&&step.settled.includes(n.id);
            return `<div class="flex items-center justify-between px-3 py-1.5 text-xs hover:bg-slate-700/30">
              <span class="mono font-bold ${settled?'text-emerald-400':d===Infinity?'text-slate-600':'text-slate-300'}">${n.id}</span>
              <span class="mono ${d===Infinity?'text-slate-600':'text-violet-300'}">${d===Infinity?'∞':d}</span>
              <span class="mono text-slate-500 text-[10px]">${prev?'via '+prev:'—'}</span>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }

    body.innerHTML = html;
  }

  function renderLSDBPanel(body) {
    let html = `<div class="text-[9px] uppercase tracking-widest text-slate-500 mb-2 mono px-1">Type 1 & Type 2 LSA — Area 0</div>`;

    // Type 1: one per node
    graph.nodes.filter(n=>n.area==='0'||n.area==='ABR').forEach(n => {
      const myLinks = graph.links.filter(l => (l.from===n.id||l.to===n.id) && l.state==='up');
      html += `<div class="rounded-xl bg-slate-800/60 border border-slate-700 overflow-hidden mb-2">
        <div class="flex items-center gap-2 px-3 py-1.5 border-b border-slate-700/60 bg-blue-500/5">
          <span class="text-[9px] mono font-bold text-blue-400 bg-blue-500/15 px-1.5 py-0.5 rounded">Type 1</span>
          <span class="text-xs mono font-bold text-slate-200">${n.label}</span>
          <span class="text-[10px] mono text-slate-500 ml-auto">${n.rid}</span>
        </div>
        ${myLinks.map(l=>{
          const peer = l.from===n.id?l.to:l.from;
          const bwt = BW_TYPES[l.bwType];
          return `<div class="flex items-center gap-3 px-3 py-1 text-[10.5px] border-b border-slate-700/30 last:border-0">
            <span class="mono text-slate-500 w-16 shrink-0">→ ${peer}</span>
            <span class="mono text-slate-400">${bwt.label.split(' ')[0]}</span>
            <span class="mono text-violet-300 ml-auto">cost ${bwt.cost}</span>
          </div>`;
        }).join('')}
        ${myLinks.length===0?`<div class="px-3 py-1.5 text-[10px] text-slate-600 italic">Không có active link</div>`:''}
      </div>`;
    });

    // Down links note
    const downLinks = graph.links.filter(l=>l.state==='down');
    if (downLinks.length>0) {
      html += `<div class="rounded-xl bg-red-900/10 border border-red-800/40 p-3 mt-1">
        <div class="text-[9px] mono font-bold text-red-400 mb-1 uppercase tracking-widest">Links DOWN — không có trong LSDB</div>
        ${downLinks.map(l=>`<div class="text-[10.5px] mono text-red-400/70 py-0.5">${l.from} ↔ ${l.to} — LSA seq# tăng, link bị xóa</div>`).join('')}
      </div>`;
    }

    body.innerHTML = html;
  }

  function renderRTPanel(body) {
    if (!spfResult) { body.innerHTML=''; return; }
    const finalStep = spfResult.steps[spfResult.steps.length-1];
    if (!finalStep.dist) { body.innerHTML='<div class="text-xs text-slate-500 p-2">Chưa có kết quả SPF.</div>'; return; }

    let html = `<div class="text-[9px] uppercase tracking-widest text-slate-500 mb-2 mono px-1">Routing Table — từ ${src}</div>`;

    const baseSPF = dijkstra(BASE_GRAPH.nodes, BASE_GRAPH.links, src);
    const baseFinal = baseSPF.steps[baseSPF.steps.length-1];

    graph.nodes.filter(n=>n.id!==src).forEach(n => {
      const cost = finalStep.dist[n.id];
      const prev = finalStep.prev && finalStep.prev[n.id];
      const baseCost = baseFinal.dist[n.id];
      const basePrev = baseFinal.prev && baseFinal.prev[n.id];
      const isChanged = cost !== baseCost || prev !== basePrev;
      const isUnreachable = cost === Infinity;
      const isDst = n.id === dst;

      html += `<div class="rounded-xl ${isDst?'border-amber-500/40 bg-amber-500/5':'border-slate-700 bg-slate-800/60'} border ${isChanged?'ring-1 ring-emerald-500/30':''} overflow-hidden mb-1.5">
        <div class="flex items-center gap-2 px-3 py-2">
          <span class="mono font-bold text-xs ${isUnreachable?'text-red-400':isDst?'text-amber-400':'text-slate-200'}">${n.id}</span>
          <span class="mono text-[10px] text-slate-500">${n.rid}</span>
          ${isDst?`<span class="ml-auto text-[9px] text-amber-400 bg-amber-400/10 px-1.5 py-0.5 rounded mono font-bold">DST</span>`:''}
          ${isChanged&&!isDst?`<span class="ml-auto text-[9px] text-emerald-400 bg-emerald-400/10 px-1.5 py-0.5 rounded mono font-bold">CHANGED</span>`:''}
        </div>
        <div class="border-t border-slate-700/50 grid grid-cols-2 divide-x divide-slate-700/50">
          <div class="px-3 py-1.5">
            <div class="text-[9px] text-slate-500 uppercase tracking-wider mb-0.5">Next-hop</div>
            <div class="mono text-xs font-bold ${isUnreachable?'text-red-400':'text-violet-300'}">${isUnreachable?'UNREACHABLE':prev||'—'}</div>
          </div>
          <div class="px-3 py-1.5">
            <div class="text-[9px] text-slate-500 uppercase tracking-wider mb-0.5">Cost</div>
            <div class="mono text-xs font-bold ${isUnreachable?'text-red-400':'text-emerald-300'}">${isUnreachable?'∞':cost}</div>
          </div>
        </div>
        ${isChanged?`<div class="border-t border-slate-700/30 px-3 py-1 text-[10px] mono text-slate-500">
          trước: via ${basePrev||'—'} cost ${baseCost===Infinity?'∞':baseCost}
        </div>`:''}
      </div>`;
    });

    body.innerHTML = html;
  }

  // ── LINK POPUP ───────────────────────────────────────
  function showLinkPopupById(linkId, event) {
    selectedLink = linkId;
    const link = graph.links.find(l=>l.id===linkId);
    if (!link) return;
    const popup = document.getElementById('bw-popup');
    const opts = document.getElementById('bw-opts');
    const toggleLbl = document.getElementById('bw-toggle-lbl');

    opts.innerHTML = BW_TYPES.map((bwt,i)=>`
      <div class="bw-opt ${link.bwType===i?'text-emerald-400':''}" onclick="App.setLinkBW('${linkId}',${i})">
        <i class="fas ${bwt.icon} mr-2" style="color:${bwt.color}"></i>${bwt.label}
        <span class="text-slate-500 ml-1">cost ${bwt.cost}</span>
      </div>`).join('');

    toggleLbl.textContent = link.state==='down' ? 'No Shutdown (Bring UP)' : 'Shutdown Link';

    popup.style.left = Math.min(event.clientX, window.innerWidth-200)+'px';
    popup.style.top  = Math.min(event.clientY+10, window.innerHeight-200)+'px';
    popup.classList.remove('hidden');
  }

  function showLinkPopup(linkId, event) {
    // called from SVG click via dataset
    showLinkPopupById(linkId, event);
  }

  function closePopup() {
    document.getElementById('bw-popup').classList.add('hidden');
    selectedLink = null;
  }

  function setLinkBW(linkId, bwTypeIdx) {
    const link = graph.links.find(l=>l.id===linkId);
    if (link) { link.bwType = bwTypeIdx; link.state = 'up'; }
    closePopup();
    runSPF(); renderTopology();
  }

  function toggleLink() {
    if (!selectedLink) return;
    const link = graph.links.find(l=>l.id===selectedLink);
    if (link) link.state = link.state==='down' ? 'up' : 'down';
    closePopup();
    runSPF(); renderTopology();
  }

  // ── TEACHING NOTE ────────────────────────────────────
  function showTeachingNote(html) {
    const el = document.getElementById('teaching-note');
    el.innerHTML = `<i class="fas fa-circle-info text-indigo-400 mr-1.5"></i>${html}`;
    el.classList.remove('hidden');
  }

  // ── THEME ─────────────────────────────────────────────
  function toggleTheme() {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('portfolio-theme', isDark?'dark':'light');
    renderTopology();
  }

  // ── RESIZE ────────────────────────────────────────────
  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { renderTopology(); }, 120);
  });

  return { init, loadScenario, resetTopology, setTab, spfNext, spfPrev, spfPlayPause, spfReset, toggleTheme, showLinkPopupById, setLinkBW, toggleLink };
})();

// expose for inline HTML onclick
window.App = App;

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
