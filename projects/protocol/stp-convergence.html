<script>
const MODES = {
    stp: {
        label: 'STP Legacy (802.1D)',
        steps: [
            {
                step: 1, phase: "STEADY STATE", phaseColor: "blue", timer: { label: "T = 0s", color: "slate" },
                title: "STP (802.1D) - Trạng thái ổn định",
                description: `Core 1 là Root Bridge. SW3 đang dùng Gi0/1 làm Root Port (Forwarding). Gi0/2 bị Blocked để chống Loop.<br><br>Trong STP 802.1D cũ, cổng Blocked hoàn toàn "câm nín", nó chỉ nhận BPDU chứ không sẵn sàng phản ứng tức thì khi có sự cố.`,
                cli_logs: `SW3# show spanning-tree\nVLAN0001\n  Root ID  Priority 4096\n           Address  0001.0001.0001\n\n  Interface  Role  Sts  Cost  Prio\n  Gi0/1      Root  FWD  19    128\n  Gi0/2      Altn  BLK  19    128`,
                nodes: {
                    Core1: { state: "ROOT BRIDGE", color: "indigo", border: "border-indigo-400" },
                    Core2: { state: "FORWARDING", color: "emerald", border: "border-emerald-400" },
                    SW3:   { state: "FWD | BLK", color: "slate", border: "border-slate-300 dark:border-slate-700" }
                },
                links: [
                    { id: "c1-c2", src: "Core1", dst: "Core2", st: "ACTIVE" },
                    { id: "sw3-c1", src: "SW3", dst: "Core1", st: "ACTIVE" },
                    { id: "sw3-c2", src: "SW3", dst: "Core2", st: "IDLE" }

                portLabels: { sw3c1: "Gi0/1 — Root Port", sw3c2: "Gi0/2 — Blocked", c1col: "indigo", c2col: "amber" },
                linkStatus: "Steady State — STP 802.1D",
                failureBadge: false, convergeBadge: null, packet: null,
                decode: { "Giao thức": "STP 802.1D", "Gi0/2 State": "Blocking", "Hello Time": "2s", "Max Age": "20s" }
            },
            {
                step: 2, phase: "LINK FAILURE", phaseColor: "red", timer: { label: "T = 0s ⚠", color: "red" },
                title: "Đứt cáp! Chờ Max Age (20 giây)",
                description: `Cáp chính Gi0/1 bị đứt. Mặc dù cổng vật lý down ngay lập tức, nhưng <strong>STP 802.1D không phản ứng ngay với cổng Blocked Gi0/2</strong>.<br><br>SW3 phải kiên nhẫn chờ cho BPDU cũ lưu trên cổng Gi0/2 "hết hạn" (Max Age = 20 giây). Mạng bị đứt gãy hoàn toàn.`,
                cli_logs: `*Nov 01 09:00:00: %LINK-3-UPDOWN: Gi0/1 DOWN\n\nSW3# Gi0/1 DOWN.\nSW3# Waiting for Max Age timer (20 seconds) on Gi0/2...\nSW3# Traffic is currently DROPPED!`,
                nodes: {
                    Core1: { state: "LINK DOWN", color: "red", border: "border-red-500" },
                    Core2: { state: "FORWARDING", color: "emerald", border: "border-emerald-400" },
                    SW3:   { state: "WAITING (20s)", color: "red", border: "border-red-500" }
                },
                links: [
                    { id: "c1-c2", src: "Core1", dst: "Core2", st: "IDLE" },
                    { id: "sw3-c1", src: "SW3", dst: "Core1", st: "DOWN" },
                    { id: "sw3-c2", src: "SW3", dst: "Core2", st: "IDLE" }
                ],
                portLabels: { sw3c1: "Gi0/1 — DOWN ❌", sw3c2: "Gi0/2 — Blocked (Waiting)", c1col: "red", c2col: "amber" },
                linkStatus: "LINK DOWN — Đang đếm ngược Max Age 20s",
                failureBadge: true, convergeBadge: null, packet: null,
                decode: { "Trạng thái mạng": "Mất kết nối hoàn toàn (Outage)", "Max Age Timer": "Đang đếm (20s)", "Tại sao phải đợi?": "Cơ chế bảo thủ của STP 802.1D" }
            },
            {
                step: 3, phase: "LISTENING", phaseColor: "amber", timer: { label: "T = 20s", color: "amber" },
                title: "Chuyển sang trạng thái Listening (15s)",
                description: `Sau 20 giây, BPDU cũ hết hạn. SW3 quyết định dùng Gi0/2 làm Root Port mới.<br><br>Nhưng nó chưa mở ngay! Nó phải vào trạng thái <strong>Listening</strong> (Forward Delay = 15s) để lắng nghe xem có ai tranh chấp Root Port với nó không. Dữ liệu <em>vẫn bị drop</em>.`,

                    Core1: { state: "UNREACHABLE", color: "red", border: "border-red-500" },
                    Core2: { state: "FORWARDING", color: "emerald", border: "border-emerald-400" },
                    SW3:   { state: "LISTENING", color: "amber", border: "border-amber-400" }
                },
                links: [
                    { id: "c1-c2", src: "Core1", dst: "Core2", st: "IDLE" },
                    { id: "sw3-c1", src: "SW3", dst: "Core1", st: "DOWN" },
                    { id: "sw3-c2", src: "SW3", dst: "Core2", st: "IDLE" }

                portLabels: { sw3c1: "Gi0/1 — DOWN ❌", sw3c2: "Gi0/2 — LIS (Waiting 15s)", c1col: "red", c2col: "amber" },
                linkStatus: "Listening State — Đang đợi 15s (Forward Delay)",
                failureBadge: false, convergeBadge: null, packet: null,
                decode: { "Gi0/2 State": "Listening (LIS)", "Chức năng": "Nghe BPDU, không chuyển Data", "Thời gian": "15 giây" }
            },
            {
                step: 4, phase: "LEARNING", phaseColor: "amber", timer: { label: "T = 35s", color: "amber" },
                title: "Chuyển sang trạng thái Learning (15s)",

                cli_logs: `*Nov 01 09:00:35: Forward Delay expired on Gi0/2.\nSW3# Gi0/2 transitioning LIS -> LRN\n\nSW3# show spanning-tree\n  Interface  Role  Sts  Cost  Prio\n  Gi0/2      Root  LRN  19    128\n\nSW3# Learning MAC addresses...\nSW3# Waiting Forward Delay (15 seconds)...`,
                nodes: {

                    { id: "sw3-c2", src: "SW3", dst: "Core2", st: "IDLE" }

                portLabels: { sw3c1: "Gi0/1 — DOWN ❌", sw3c2: "Gi0/2 — LRN (Waiting 15s)", c1col: "red", c2col: "amber" },
                linkStatus: "Learning State — Đang đợi 15s (Forward Delay)",
                failureBadge: false, convergeBadge: null, packet: null,
                decode: { "Gi0/2 State": "Learning (LRN)", "Chức năng": "Học MAC, vẫn không chuyển Data", "Thời gian": "Thêm 15 giây" }

            {

class StpConvergenceSimulator {
    constructor() {
        this.currentMode = 'rstp';
        this.idx = 0;
        this.playing = false;
        this.intervalId = null;
        this.currentAnim = null;
        this.dom = {
            stepper: document.getElementById('stepper-container'),
            progress: document.getElementById('timeline-progress'),
            btnPrev: document.getElementById('btn-prev'),
            btnNext: document.getElementById('btn-next'),
            btnPlay: document.getElementById('btn-play'),
            iconPlay: document.getElementById('icon-play'),
            themeIcon: document.getElementById('theme-icon'),
            phaseBadge: document.getElementById('phase-badge'),
            timerBadge: document.getElementById('timer-badge'),
            title: document.getElementById('step-title'),
            desc: document.getElementById('step-desc'),
            cli: document.getElementById('cli-logs'),
            canvas: document.getElementById('topology-canvas'),
            svg: document.getElementById('links-svg'),
            linkStatus: document.getElementById('link-status-text'),
            packet: document.getElementById('animated-packet'),
            packetIcon: document.getElementById('packet-icon'),
            packetLabel: document.getElementById('packet-label'),
            decodePanel: document.getElementById('decode-panel'),
            decodeBody: document.getElementById('decode-body'),
            decodeTitle: document.getElementById('decode-title'),
            failureBadge: document.getElementById('failure-badge'),
            convergeBadge: document.getElementById('converge-badge'),
            portSw3c1: document.getElementById('port-sw3-core1'),
            portSw3c2: document.getElementById('port-sw3-core2'),
        };
        window.addEventListener('resize', () => { this.clampNodes(); this.drawLinks(MODES[this.currentMode].steps[this.idx].links); });
        this.init();
    }

    init() {
        let dark = false;
        try { const s = localStorage.getItem('portfolio-theme'); dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches; } catch(e){}
        document.documentElement.classList.toggle('dark', dark);
        if (this.dom.themeIcon) this.dom.themeIcon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
        this.updateModeToggleUI();
        this.buildStepper();
        this.render(0);
    }

    switchMode(modeId) {
        this.pause();
        this.currentMode = modeId;
        this.updateModeToggleUI();
        this.buildStepper();
        this.render(0);
    }

    updateModeToggleUI() {
        document.querySelectorAll('.mode-btn').forEach(btn => {
            if (btn.id === `mode-btn-${this.currentMode}`) {
                btn.className = 'mode-btn px-5 py-2 text-sm font-bold rounded-md transition-all bg-white dark:bg-slate-700 shadow-sm text-blue-600 dark:text-blue-400';
            } else {
                btn.className = 'mode-btn px-5 py-2 text-sm font-bold rounded-md transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
            }
        });
    }

    buildStepper() {
        const steps = MODES[this.currentMode].steps;
        this.dom.stepper.innerHTML = '';
        steps.forEach((d, i) => {
            const btn = document.createElement('button');
            btn.id = `step-btn-${i}`;
            btn.innerHTML = `<span class="hidden md:block">${d.step}. ${d.phase}</span><span class="md:hidden">${d.step}</span>`;
            btn.className = 'relative w-10 h-10 md:w-auto md:px-4 md:py-2 rounded-full font-bold text-xs md:text-sm border-2 transition-all duration-300 z-10 flex items-center justify-center bg-white dark:bg-slate-900 shadow-sm hover:scale-105';
            btn.onclick = () => { this.pause(); this.render(i); };
            this.dom.stepper.appendChild(btn);
        });
    }

    colorClass(c) {
        const m = {
            slate: 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border-slate-300 dark:border-slate-600',
            blue: 'bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 border-blue-300 dark:border-blue-700/50',
            indigo: 'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 border-indigo-300 dark:border-indigo-700/50',
            emerald: 'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 border-emerald-300 dark:border-emerald-700/50',
            amber: 'bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 border-amber-300 dark:border-amber-700/50',
            red: 'bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 border-red-300 dark:border-red-700/50',
        };
        return m[c] || m.slate;
    }

    clampNodes() {
        if (!this.dom.canvas) return;
        const cr = this.dom.canvas.getBoundingClientRect();
        const BADGE_PX = 20, EDGE_PX = 6;
        this.dom.canvas.querySelectorAll('[id^="node-"]').forEach(node => {
            const nr = node.getBoundingClientRect();
            const hPx = cr.height / 100, wPx = cr.width / 100;
            let top = parseFloat(node.style.top) || 50;
            let left = parseFloat(node.style.left) || 50;
            const topClip = (cr.top + BADGE_PX) - nr.top;       if (topClip > 0) top += topClip / hPx;
            const botClip = nr.bottom - (cr.bottom - EDGE_PX);   if (botClip > 0) top -= botClip / hPx;
            const leftClip = (cr.left + EDGE_PX) - nr.left;      if (leftClip > 0) left += leftClip / wPx;
            const rightClip = nr.right - (cr.right - EDGE_PX);   if (rightClip > 0) left -= rightClip / wPx;
            node.style.top = top + '%'; node.style.left = left + '%';
        });
    }

    drawLinks(links) {
        this.dom.svg.innerHTML = '';
        const cr = this.dom.canvas.getBoundingClientRect();
        const dark = document.documentElement.classList.contains('dark');
        links.forEach(lk => {
            const s = document.getElementById('node-' + lk.src);
            const t = document.getElementById('node-' + lk.dst);
            if (!s || !t) return;
            const sr = s.getBoundingClientRect(), tr = t.getBoundingClientRect();
            const x1 = sr.left - cr.left + sr.width/2, y1 = sr.top - cr.top + sr.height/2;
            const x2 = tr.left - cr.left + tr.width/2, y2 = tr.top - cr.top + tr.height/2;
            const line = document.createElementNS('http://www.w3.org/2000/svg','line');
            line.setAttribute('x1',x1); line.setAttribute('y1',y1);
            line.setAttribute('x2',x2); line.setAttribute('y2',y2);
            line.setAttribute('stroke-width','5'); line.setAttribute('stroke-linecap','round');
            if (lk.st === 'ACTIVE') {
                line.setAttribute('stroke', dark ? '#60a5fa' : '#3b82f6');
                line.setAttribute('stroke-dasharray','12,12');
                line.classList.add('animate-dash');
            } else if (lk.st === 'DOWN') {
                line.setAttribute('stroke', dark ? 'rgba(239,68,68,0.8)' : 'rgba(239,68,68,0.9)');
                line.setAttribute('stroke-dasharray','3,12');
                line.setAttribute('stroke-width','4');
            } else {
                line.setAttribute('stroke', dark ? 'rgba(71,85,105,0.3)' : 'rgba(203,213,225,0.4)');
                line.setAttribute('stroke-dasharray','6,12');
            }
            this.dom.svg.appendChild(line);
        });
    }

    render(i) {
        this.idx = i;
        const steps = MODES[this.currentMode].steps;
        const d = steps[i];

        // Stepper
        steps.forEach((_,j) => {
            const b = document.getElementById(`step-btn-${j}`);
            if (!b) return;
            if (j < i) b.className = 'relative w-10 h-10 md:w-auto md:px-4 md:py-2 rounded-full font-bold text-xs md:text-sm border-2 transition-all duration-300 z-10 flex items-center justify-center bg-blue-500 text-white border-blue-500 cursor-pointer shadow';
            else if (j === i) b.className = 'relative w-10 h-10 md:w-auto md:px-4 md:py-2 rounded-full font-bold text-xs md:text-sm border-2 transition-all duration-300 z-10 flex items-center justify-center bg-blue-50 dark:bg-blue-900/30 text-blue-500 border-blue-300 dark:border-blue-700 cursor-pointer';
            else b.className = 'relative w-10 h-10 md:w-auto md:px-4 md:py-2 rounded-full font-bold text-xs md:text-sm border-2 transition-all duration-300 z-10 flex items-center justify-center bg-white dark:bg-slate-800 text-slate-400 border-slate-200 dark:border-slate-700 cursor-pointer';
        });
        this.dom.progress.style.width = steps.length > 1 ? `${(i / (steps.length - 1)) * 100}%` : '100%';

        // Content
        this.dom.phaseBadge.textContent = d.phase;
        const tcMap = { slate: 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400 border-slate-300 dark:border-slate-600', red: 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400 border-red-300 dark:border-red-700/50', indigo: 'bg-indigo-100 text-indigo-700 dark:bg-indigo-900/30 dark:text-indigo-400 border-indigo-300 dark:border-indigo-700/50', emerald: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400 border-emerald-300 dark:border-emerald-700/50', blue: 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 border-blue-300 dark:border-blue-700/50', amber: 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400 border-amber-300 dark:border-amber-700/50' };
        
        if (d.timer) {
            this.dom.timerBadge.classList.remove('hidden');
            this.dom.timerBadge.textContent = d.timer.label;
            this.dom.timerBadge.className = `text-xs font-mono font-bold px-2 py-1 rounded border ${tcMap[d.timer.color] || tcMap.slate}`;
        } else {
            this.dom.timerBadge.classList.add('hidden');
        }
        
        const phaseColors = {
            blue: 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 border-blue-200 dark:border-blue-700/50',
            red: 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400 border-red-200 dark:border-red-700/50',
            amber: 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400 border-amber-200 dark:border-amber-700/50',
            indigo: 'bg-indigo-100 text-indigo-700 dark:bg-indigo-900/30 dark:text-indigo-400 border-indigo-200 dark:border-indigo-700/50',
            emerald: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400 border-emerald-200 dark:border-emerald-700/50'
        };
        this.dom.phaseBadge.className = `px-3 py-1 rounded text-xs font-bold uppercase tracking-widest border ${phaseColors[d.phaseColor] || phaseColors.blue}`;

        this.dom.title.textContent = d.title;
        this.dom.desc.innerHTML = d.description;
        this.dom.cli.textContent = d.cli_logs;

        // Nodes
        Object.entries(d.nodes).forEach(([id, nd]) => {
            const stEl = document.getElementById(`state-${id}`);
            const card = document.getElementById(`node-${id}`);
            if (stEl) { stEl.textContent = nd.state; stEl.className = `text-[10px] md:text-xs font-black tracking-widest px-2 py-1 mt-2 rounded ${this.colorClass(nd.color)} border`; }
            if (card) {
                const extra = nd.color === 'emerald' && i >= 4 ? ' success-pulse' : nd.color === 'red' ? ' danger-pulse' : '';
                card.className = `absolute w-36 md:w-52 bg-white dark:bg-slate-800 rounded-xl p-4 border-2 shadow-lg flex flex-col items-center transition-all duration-500 z-10 ${nd.border}${extra}`;
            }
        });

        // Port labels
        if (this.dom.portSw3c1) {
            this.dom.portSw3c1.textContent = d.portLabels.sw3c1;
            const c1c = { red: 'bg-red-100 dark:bg-red-900/60 text-red-700 dark:text-red-300 border-red-200 dark:border-red-700', blue: 'bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300 border-blue-200 dark:border-blue-700', indigo: 'bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 border-indigo-200 dark:border-indigo-700' };
            this.dom.portSw3c1.className = `absolute z-20 text-[9px] font-bold font-mono px-1.5 py-0.5 rounded border transition-all duration-300 ${c1c[d.portLabels.c1col] || c1c.blue}`;
        }
        if (this.dom.portSw3c2) {
            this.dom.portSw3c2.textContent = d.portLabels.sw3c2;
            const c2c = { amber: 'bg-amber-100 dark:bg-amber-900/60 text-amber-700 dark:text-amber-300 border-amber-200 dark:border-amber-700', emerald: 'bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-700', blue: 'bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300 border-blue-200 dark:border-blue-700' };
            this.dom.portSw3c2.className = `absolute z-20 text-[9px] font-bold font-mono px-1.5 py-0.5 rounded border transition-all duration-300 ${c2c[d.portLabels.c2col] || c2c.amber}`;
        }

        // Status
        this.dom.linkStatus.textContent = d.linkStatus;
        if (this.dom.failureBadge) this.dom.failureBadge.classList.toggle('hidden', !d.failureBadge);
        
        if (d.convergeBadge) {
            this.dom.convergeBadge.classList.remove('hidden');
            this.dom.convergeBadge.innerHTML = `<i class="fas fa-check-circle"></i> ${d.convergeBadge.text}`;
            this.dom.convergeBadge.className = `absolute top-4 left-1/2 -translate-x-1/2 z-30 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg flex items-center gap-2 ${d.convergeBadge.color}`;
        } else {
            this.dom.convergeBadge.classList.add('hidden');
        }

        this.animatePacket(d.packet);

        // Decode
        if (d.decode) {
            this.dom.decodePanel.classList.remove('hidden');
            this.dom.decodeBody.innerHTML = Object.entries(d.decode).map(([k,v]) =>
                `<tr class="w-full flex"><td class="py-2 px-4 font-semibold text-slate-400 w-2/5 min-w-[140px] whitespace-nowrap">${k}</td><td class="py-2 pr-4 text-emerald-400 w-3/5 break-words">${v}</td></tr>`
            ).join('');
        }

        if (this.dom.btnPrev) this.dom.btnPrev.disabled = i === 0;
        if (this.dom.btnNext) this.dom.btnNext.disabled = i === steps.length - 1;
        if (i === steps.length - 1 && this.playing) this.pause();

        setTimeout(() => { this.clampNodes(); this.drawLinks(d.links); }, 50);
    }

    animatePacket(p) {
        if (this.currentAnim) this.currentAnim.cancel();
        if (!p) { this.dom.packet.classList.add('hidden'); return; }
        const src = document.getElementById('node-' + p.from);
        const tgt = document.getElementById('node-' + p.to);
        if (!src || !tgt) { this.dom.packet.classList.add('hidden'); return; }
        this.dom.packetLabel.textContent = p.label;
        this.dom.packetIcon.className = `fas ${p.icon}`;
        this.dom.packet.className = `absolute z-50 flex items-center gap-2 px-3 py-1.5 rounded-full text-[10px] md:text-xs font-bold text-white whitespace-nowrap ${p.color} shadow-lg`;
        this.dom.packet.classList.remove('hidden');
        const cr = this.dom.canvas.getBoundingClientRect();
        const sr = src.getBoundingClientRect(), tr = tgt.getBoundingClientRect();
        const sx = sr.left-cr.left+sr.width/2, sy = sr.top-cr.top+sr.height/2;
        const tx = tr.left-cr.left+tr.width/2, ty = tr.top-cr.top+tr.height/2;
        this.dom.packet.style.left = '0px'; this.dom.packet.style.top = '0px';
        this.currentAnim = this.dom.packet.animate([
            { transform: `translate(calc(${sx}px - 50%), calc(${sy}px - 50%)) scale(0.8)`, opacity: 0 },
            { transform: `translate(calc(${sx}px - 50%), calc(${sy}px - 50%)) scale(1)`,   opacity: 1, offset: 0.1 },
            { transform: `translate(calc(${tx}px - 50%), calc(${ty}px - 50%)) scale(1)`,   opacity: 1, offset: 0.88 },
            { transform: `translate(calc(${tx}px - 50%), calc(${ty}px - 50%)) scale(0.8)`, opacity: 0 },
        ], { duration: 2600, easing: 'cubic-bezier(0.4,0,0.2,1)', fill: 'forwards' });
    }

    nextStep() { const len = MODES[this.currentMode].steps.length; if (this.idx < len - 1) this.render(this.idx + 1); }
    prevStep() { if (this.idx > 0) this.render(this.idx - 1); }
    togglePlay() { this.playing ? this.pause() : this.play(); }
    play() {
        const len = MODES[this.currentMode].steps.length;
        if (this.idx === len - 1) this.render(0);
        this.playing = true;
        if (this.dom.iconPlay) this.dom.iconPlay.className = 'fas fa-pause';
        if (this.dom.btnPlay) { this.dom.btnPlay.classList.replace('bg-blue-600','bg-amber-500'); this.dom.btnPlay.classList.replace('hover:bg-blue-700','hover:bg-amber-600'); }
        this.intervalId = setInterval(() => { if (this.idx < len - 1) this.nextStep(); }, 5000);
    }
    pause() {
        this.playing = false; clearInterval(this.intervalId);
        if (this.dom.iconPlay) this.dom.iconPlay.className = 'fas fa-play ml-1';
        if (this.dom.btnPlay) { this.dom.btnPlay.classList.replace('bg-amber-500','bg-blue-600'); this.dom.btnPlay.classList.replace('hover:bg-amber-600','hover:bg-blue-700'); }
    }
    reset() { this.pause(); this.render(0); }
    toggleTheme() {
        const dark = !document.documentElement.classList.contains('dark');
        document.documentElement.classList.toggle('dark', dark);
        if (this.dom.themeIcon) this.dom.themeIcon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
        try { localStorage.setItem('portfolio-theme', dark ? 'dark' : 'light'); } catch(e){}
        this.clampNodes();
        this.drawLinks(MODES[this.currentMode].steps[this.idx].links);
    }
}

let app;
window.addEventListener('DOMContentLoaded', () => { app = new StpConvergenceSimulator(); });
</script>
</body>
</html>
