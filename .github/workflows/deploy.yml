name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Pages
              uses: actions/configure-pages@v5

            # No build step — this is a plain static site (see README "Run locally").
            # Uploads the repo root as-is; dev-only files (package.json, eslint
            # config, etc) end up served too, but they're inert and harmless.
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: '.'

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
